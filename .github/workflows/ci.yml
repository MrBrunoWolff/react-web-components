name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: '1'
  WRANGLER_SEND_METRICS: 'false'
  ASTRO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  code:
    name: Code (rich)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Validate code
        run: node scripts/quality.mjs code

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Validate security
        run: node scripts/quality.mjs security

  quality:
    name: Quality Gates
    if: always() && github.event_name != 'schedule'
    needs: [code, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const results = JSON.parse(process.env.RESULTS);
          for (const [name, job] of Object.entries(results)) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${name}: ${job.result}\n`);
          }
          if (Object.values(results).some(job => job.result !== 'success')) process.exit(1);
          JS

  publish:
    name: Publish to npm
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    needs: quality
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Trusted publishing (OIDC): npm verifies this workflow's identity against
    # the trusted publisher configured on the package, so there is no token to
    # store, leak or rotate.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # npm drives the publish: trusted publishing is an npm CLI feature and
      # `bun publish` has no OIDC support.
      - name: Setup Node.js for npm publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) / node $(node --version)"

      # Install and build at the workspace root — the library's build pulls in
      # workspace-linked packages, so it cannot run from the package alone.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the library
        run: bun run build:lib

      # Publish from the package directory: this is a monorepo and only
      # packages/react-web-components is published, not the workspace root
      # (which is private and named ...-monorepo).
      - name: Publish to npm (if version changed)
        working-directory: packages/react-web-components
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          if ! npm view "$PACKAGE_NAME" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME does not exist on npm yet."
            echo "Publish once manually, then configure the trusted publisher."
            exit 0
          fi

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION already exists, skipping publish"
            exit 0
          fi

          echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION via trusted publishing"

          # A failure here is a real failure. Auth errors used to be tolerated
          # while trusted publishers were still being set up, but that made a
          # green run mean "nothing went wrong" rather than "published" — the
          # wrong signal for a release pipeline. If this fails with E404 or
          # EOTP, the trusted publisher for this package is missing or its
          # fields do not match: organization MrBrunoWolff, this repository,
          # workflow ci.yml, environment empty.
          npm publish
          echo "Published $PACKAGE_NAME@$PACKAGE_VERSION"
