name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # lint + format, in parallel.
      - name: Check
        run: bun run check:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The library is published from this package, so the artifact consumers
      # actually install gets built too.
      - name: Build library
        run: bun run build:lib

      # Fails the build on a high or critical advisory. The release-age gate in
      # bunfig slows a malicious package down; this is what notices a known one.
      - name: Audit
        run: bun run audit
